<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wastewater Flowrates - Final Practice Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Montserrat:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #f1f5f9; }
        .ar-font { font-family: 'Cairo', sans-serif; }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 selection:bg-indigo-200">

    <div class="w-full max-w-4xl bg-white rounded-3xl shadow-2xl overflow-hidden relative border border-slate-200 min-h-[500px] flex flex-col" id="quiz-container">
        
        <!-- Header -->
        <div class="bg-slate-900 text-white p-6 md:p-8 flex justify-between items-center z-10 relative">
            <div>
                <p class="text-indigo-400 font-black text-[10px] tracking-[0.2em] uppercase mb-1">Civil Engineering Practice</p>
                <h1 class="text-xl md:text-2xl font-black uppercase tracking-tight">Wastewater Flowrates</h1>
            </div>
            <div class="text-right">
                <span id="question-counter" class="bg-indigo-600 px-4 py-2 rounded-xl text-sm font-black shadow-lg">Q 1 / 4</span>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="flex bg-slate-100 h-2 w-full" id="progress-bar">
            <!-- Filled via JS -->
        </div>

        <!-- Content Body -->
        <div class="flex-grow p-6 md:p-8 bg-white relative z-10 flex flex-col justify-center" id="quiz-content">
            <!-- Dynamic Content goes here -->
        </div>

    </div>

    <script>
        const quizData = [
            {
                question: "A city has a population of 25,000. The average per capita water consumption is 350 L/d. Calculate the hourly peak dry weather flow in m³/d using Harmon's formula.",
                options: [
                    { text: "22,361 m³/d", isCorrect: true, feedback: { en: "Correct! Avg Flow = 25,000 × 350 / 1000 = 8,750 m³/d. PF = 1 + 14/(4+√25) = 2.555. Peak = 8,750 × 2.555 = 22,361 m³/d.", ar: "إجابة دقيقة! قمتِ بحساب المتوسط ثم ضربه بعامل الذروة الصحيح." } },
                    { text: "8,750 m³/d", isCorrect: false, feedback: { en: "Incorrect. This is only the Average Daily Flow. You must multiply it by the Peaking Factor (PF).", ar: "هذا هو التدفق المتوسط فقط، لقد نسيت الضرب بعامل الذروة." } },
                    { text: "30,625 m³/d", isCorrect: false, feedback: { en: "Incorrect. You used a random Peaking Factor of 3.5. You must calculate the exact PF using Harmon's formula.", ar: "استخدمت عامل ذروة عشوائي، يجب حسابه عبر قانون هارمون." } },
                    { text: "13,361 m³/d", isCorrect: false, feedback: { en: "Incorrect. Check your calculations. Remember that Peak Flow = Average Flow × PF.", ar: "تأكد من أولويات الحساب وعملية الضرب." } }
                ]
            },
            {
                question: "Population is 60,000 with an average flow of 320 Lpcd. Sewer length is 5 m/capita with an equivalent diameter of 25 cm. The allowable infiltration is 900 L/(cm.km.d) and peak I/I factor is 1.4. (Note: Dry weather PF is 2.19). Calculate the Total Peak Wet Weather Flow (in m³/d).",
                options: [
                    { text: "25,950 m³/d", isCorrect: false, feedback: { en: "Incorrect. You added the Average Dry Flow and Average I/I. You must find the PEAK of both before adding them.", ar: "قمت بجمع المتوسطات بدلاً من جمع قيم الذروة." } },
                    { text: "42,085 m³/d", isCorrect: false, feedback: { en: "Incorrect. This is the Peak DRY weather flow only. You forgot to add the Peak Infiltration/Inflow (I/I).", ar: "هذه الذروة المنزلية الجافة فقط، نسيت إضافة ذروة الارتشاح المطرية." } },
                    { text: "51,535 m³/d", isCorrect: true, feedback: { en: "Perfect! Peak Dry = (60k × 320/1000) × 2.19 = 42,085. Peak I/I = (900 × 25 × 300 / 1000) × 1.4 = 9,450. Total = 42,085 + 9,450 = 51,535.", ar: "عمل رائع! قمت بجمع الذروة الجافة مع الذروة المطرية بشكل سليم." } },
                    { text: "48,835 m³/d", isCorrect: false, feedback: { en: "Incorrect. You added the Peak Dry flow with the AVERAGE I/I flow. Multiply the I/I by its peak factor (1.4).", ar: "قمت بجمع الذروة الجافة مع متوسط الارتشاح بدل ذروة الارتشاح." } }
                ]
            },
            {
                question: "A plant recorded these flows: Dry period = 180,000 m³/d. Wet period (no rain) = 320,000 m³/d. Peak storm = 800,000 m³/d. Preceding day = 450,000 m³/d. Network (Dia × Length) = 250,000 mm.km. Is the infiltration excessive? (Excessive limit = 0.75).",
                options: [
                    { text: "140,000 m³/d, Not Excessive", isCorrect: true, feedback: { en: "Correct! Infiltration = Wet - Dry = 320k - 180k = 140,000. Ratio = 140,000 / 250,000 = 0.56 < 0.75 limit.", ar: "تحليل دقيق! الارتشاح طبيعي لأنه أقل من الحد المسموح." } },
                    { text: "350,000 m³/d, Excessive", isCorrect: false, feedback: { en: "Incorrect. You calculated the INFLOW (Peak Storm - Preceding). Infiltration is (Wet Period - Dry Period).", ar: "لقد قمت بحساب مياه المطر Inflow بدلاً من الارتشاح Infiltration." } },
                    { text: "140,000 m³/d, Excessive", isCorrect: false, feedback: { en: "Incorrect conclusion. The calculation is right (140,000), but 140k / 250k = 0.56, which is LESS than 0.75.", ar: "الاستنتاج خاطئ، الرقم 0.56 أصغر من 0.75 لذلك ليس مفرطاً." } },
                    { text: "500,000 m³/d, Excessive", isCorrect: false, feedback: { en: "Incorrect. You ADDED the Wet and Dry flows. You must SUBTRACT them to find the groundwater infiltration.", ar: "قمت بجمع الموسمين بدلاً من إيجاد الفرق بينهما." } }
                ]
            },
            {
                question: "Population grows from 40k to 60k. Current total flow is 18,000 m³/d and current I/I is 70 Lpcd. A 15% reduction in consumption will apply ONLY to the new population. A new college adds 200 m³/d and an industry adds 2,000 m³/d. Calculate the Final Design Daily Average Flow.",
                options: [
                    { text: "25,780 m³/d", isCorrect: false, feedback: { en: "Incorrect. You applied the 15% reduction to the ENTIRE 60,000 population. It applies ONLY to the new population.", ar: "قمت بتطبيق التوفير على كل السكان بدل الزيادة السكانية فقط." } },
                    { text: "23,860 m³/d", isCorrect: false, feedback: { en: "Incorrect. You forgot to add the Future I/I flow (for the 60,000 people) to the final sum.", ar: "نسيت إضافة الارتشاح المستقبلي لكامل السكان في المجموع النهائي." } },
                    { text: "28,060 m³/d", isCorrect: true, feedback: { en: "Perfect! Old Net=15,200. New Net=20k×323/1k=6,460. Future I/I=4,200. Total = 15,200 + 6,460 + 200 + 4,200 + 2000 = 28,060.", ar: "عمل هندسي رائع! فصلت الحالي، وحسبت المستقبلي، وجمعت كل المكونات صحيحاً." } },
                    { text: "32,050 m³/d", isCorrect: false, feedback: { en: "Incorrect. You did not subtract the current I/I from the 18,000 m³/d before finding the current Lpcd.", ar: "نسيت خصم الارتشاح الحالي من 18 ألف قبل إيجاد حصة الفرد." } }
                ]
            }
        ];

        let currentQuestionIndex = 0;
        const contentDiv = document.getElementById('quiz-content');
        const counterDiv = document.getElementById('question-counter');
        const progressDiv = document.getElementById('progress-bar');

        function loadQuestion() {
            const q = quizData[currentQuestionIndex];
            counterDiv.innerText = `Q ${currentQuestionIndex + 1} / ${quizData.length}`;
            
            // Update Progress Bar
            progressDiv.innerHTML = '';
            for (let i = 0; i < quizData.length; i++) {
                const step = document.createElement('div');
                step.className = `flex-1 transition-all duration-500 ${i <= currentQuestionIndex ? 'bg-indigo-500' : 'bg-slate-200'} ${i !== 0 ? 'border-l border-white' : ''}`;
                progressDiv.appendChild(step);
            }

            let optionsHtml = '';
            q.options.forEach((opt, index) => {
                optionsHtml += `
                    <button onclick="selectOption(${index})" id="btn-${index}" class="w-full text-left p-5 rounded-2xl font-bold text-lg transition-all duration-300 border-2 bg-white border-slate-200 text-slate-700 hover:border-indigo-400 hover:bg-indigo-50 hover:shadow-md active:scale-95">
                        ${opt.text}
                    </button>
                `;
            });

            contentDiv.innerHTML = `
                <div class="fade-in">
                    <div class="p-6 bg-indigo-50/50 border border-indigo-100 rounded-2xl mb-8 flex gap-4 items-start shadow-sm">
                        <svg class="w-8 h-8 text-indigo-600 shrink-0 mt-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <h2 class="text-xl font-black text-slate-800 leading-relaxed">${q.question}</h2>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="options-container">
                        ${optionsHtml}
                    </div>
                    <div id="feedback-container" class="mt-8 hidden"></div>
                </div>
            `;
        }

        function selectOption(selectedIndex) {
            const q = quizData[currentQuestionIndex];
            const selectedOpt = q.options[selectedIndex];
            const feedbackContainer = document.getElementById('feedback-container');
            const btns = document.querySelectorAll('#options-container button');

            // Disable all buttons
            btns.forEach((btn, idx) => {
                btn.disabled = true;
                btn.classList.remove('hover:border-indigo-400', 'hover:bg-indigo-50', 'active:scale-95');
                
                if (idx === selectedIndex) {
                    if (selectedOpt.isCorrect) {
                        btn.className = "w-full text-left p-5 rounded-2xl font-bold text-lg border-2 bg-emerald-500 border-emerald-600 text-white shadow-lg";
                    } else {
                        btn.className = "w-full text-left p-5 rounded-2xl font-bold text-lg border-2 bg-rose-50 border-rose-400 text-rose-700 shake";
                    }
                } else if (q.options[idx].isCorrect) {
                    // Show correct answer if they got it wrong
                    btn.className = "w-full text-left p-5 rounded-2xl font-bold text-lg border-2 bg-emerald-100 border-emerald-300 text-emerald-800";
                } else {
                    btn.className = "w-full text-left p-5 rounded-2xl font-bold text-lg border-2 bg-slate-50 border-slate-200 text-slate-400 opacity-50";
                }
            });

            // Show Feedback
            const iconSvg = selectedOpt.isCorrect 
                ? `<svg class="w-8 h-8 text-emerald-600 shrink-0 mt-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>`
                : `<svg class="w-8 h-8 text-rose-600 shrink-0 mt-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>`;

            const bgClass = selectedOpt.isCorrect ? 'bg-emerald-50 border-emerald-200' : 'bg-rose-50 border-rose-200';
            const textClassEn = selectedOpt.isCorrect ? 'text-emerald-800' : 'text-rose-800';
            const textClassAr = selectedOpt.isCorrect ? 'text-emerald-700 border-emerald-200' : 'text-rose-700 border-rose-200';

            const nextBtnText = (currentQuestionIndex < quizData.length - 1) ? "NEXT QUESTION" : "SEE RESULTS";

            feedbackContainer.innerHTML = `
                <div class="p-6 rounded-3xl border-2 ${bgClass} fade-in shadow-inner">
                    <div class="flex items-start gap-4">
                        ${iconSvg}
                        <div class="flex-grow">
                            <p class="font-black text-lg mb-2 ${textClassEn}">${selectedOpt.feedback.en}</p>
                            <p class="ar-font font-bold text-sm text-right leading-relaxed ${textClassAr} border-t pt-3 mt-3">${selectedOpt.feedback.ar}</p>
                        </div>
                    </div>
                    <button onclick="nextQuestion()" class="mt-6 w-full py-4 bg-slate-900 hover:bg-slate-800 text-white rounded-xl font-black uppercase tracking-widest transition-all shadow-xl active:scale-95 flex items-center justify-center gap-2">
                        ${nextBtnText}
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    </button>
                </div>
            `;
            feedbackContainer.classList.remove('hidden');
        }

        function nextQuestion() {
            if (currentQuestionIndex < quizData.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            contentDiv.innerHTML = `
                <div class="fade-in text-center p-8">
                    <svg class="w-24 h-24 text-yellow-500 mx-auto mb-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>
                    <h1 class="text-3xl font-black text-slate-800 mb-4 uppercase tracking-tight">Practice Complete!</h1>
                    <p class="text-slate-500 font-bold mb-8 ar-font text-lg">ألف مبروك! لقد أتممت جميع الحسابات الهندسية بنجاح. أنت الآن جاهز للامتحان.</p>
                    <button onclick="restartQuiz()" class="w-full md:w-auto px-10 py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-black transition-all active:scale-95 shadow-lg uppercase tracking-widest">
                        Restart Quiz
                    </button>
                </div>
            `;
            counterDiv.innerText = "DONE";
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            loadQuestion();
        }

        // إجبار الأسئلة على التحميل فوراً لتجنب الشاشة البيضاء
        loadQuestion();

    </script>
</body>
</html>
